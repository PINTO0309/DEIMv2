__include__: [
  '../dataset/wholebody40_instance.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

output_dir: ./outputs/deimv2_hgnetv2_pico_wholebody40_ins

DEIM:
  encoder: LiteEncoder
  decoder: DEIMTransformer

HGNetv2:
  name: 'Pico'
  return_idx: [2]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

LiteEncoder:
  in_channels: [512]
  feat_strides: [16]

  hidden_dim: 112

  expansion: 0.34
  depth_mult: 0.5
  act: 'silu'

DEIMTransformer:
  feat_channels: [112, 112]
  feat_strides: [16, 32]
  hidden_dim: 112
  num_levels: 2
  num_points: [4, 2]

  num_layers: 3
  eval_idx: -1
  num_queries: 340
  dim_feedforward: 320
  share_bbox_head: True
  use_gateway: False
  mask_feature_level: 0 # 0=stride16, 1=stride32
  use_contour_aux_head: False
  use_distance_aux_head: False
  aux_mask_feature_level: 0

PostProcessor:
  num_top_queries: 340

epoches: 500

warmup_iter: 4000
flat_epoch: 250
no_aug_epoch: 32
lr_gamma: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0008
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0008
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.000025

eval_spatial_size: [640, 640]
train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, p: 0.5, fill: 0, side_range: [1.0, 1.5]}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 2}
        - {type: RandomHorizontalFlipWithClass, class_pairs: [[9, 15], [10, 14], [11, 13], [23, 24], [27, 28], [30, 31], [33, 34]]}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 2}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 250, 400]
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
      mosaic_prob: -0.1
  total_batch_size: 6
  num_workers: 6

  collate_fn:
    mixup_prob: 0.0
    mixup_epochs: [40000, 15000]
    copyblend_prob: 0.0
    copyblend_epochs: [40000, 15000]
    stop_epoch: 468
    ema_restart_decay: 0.9999
    base_size: 640
    base_size_repeat: ~

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 16
  num_workers: 16

DEIMCriterion:
  weight_dict:
    loss_mal: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mask_bce: 5
    loss_mask_dice: 5
    loss_mask_boundary: 1.0
    loss_mask_contour: 0.5
    loss_mask_distance: 0.25
  losses: ['mal', 'boxes', 'masks']
  use_uni_set: False
  use_boundary_aware_loss: False
  boundary_aware_width: 3
  boundary_aware_weight: 2.0
  use_contour_detection: False
  use_distance_transform: False
  distance_transform_steps: 5

  matcher:
    matcher_change_epoch: 450
